    method: POST
    body:
      mimeType: application/json
      text: "{}"
    headers:
      - name: Content-Type
        value: application/json
    scripts:
      preRequest: insomnia.variables.set('var', 666);
      afterResponse: |-
        insomnia.test('check var', () => {
          insomnia.expect(insomnia.variables.get('var')).to.eql(666);
        });
