openapi: 3.1.1
info:
  title: Pet Store (OpenAPI 3.1 sample)
  version: 1.0.0
  summary: Sample document exercising OpenAPI 3.1 features
  description: Used to test Insomnia's lint support for OpenAPI 3.1.
  contact:
    email: support@insomnia.rest
  license:
    name: Apache 2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
  - url: https://api.example.com/v1
tags:
  - name: pets
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      description: List pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          schema:
            type: [integer, 'null']
            exclusiveMinimum: 0
        - name: status
          in: query
          schema:
            const: available
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      summary: Create a pet
      description: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPet
      summary: Get a pet
      description: Get a pet
      tags: [pets]
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /uploads:
    post:
      operationId: upload
      summary: Upload a picture
      description: Upload a picture
      tags: [pets]
      requestBody:
        content:
          application/octet-stream: {}
          image/png:
            schema:
              type: string
              contentMediaType: image/png
              contentEncoding: base64
      responses:
        '204':
          description: Uploaded
webhooks:
  petAdopted:
    post:
      operationId: onPetAdopted
      summary: Fired when a pet is adopted
      description: Fired when a pet is adopted
      tags: [pets]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Acknowledged
components:
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          examples: [Rex]
        tag:
          type: [string, 'null']
        nickname:
          $ref: '#/components/schemas/Nickname'
          description: Sibling keyword next to $ref (allowed in 3.1)
    Nickname:
      type: string
      examples: [Buddy]
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
  securitySchemes:
    mtls:
      type: mutualTLS
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
