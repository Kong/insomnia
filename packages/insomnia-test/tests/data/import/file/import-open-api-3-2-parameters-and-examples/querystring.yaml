openapi: 3.2.0
info: { title: Search, version: 1.0.0 }
paths:
  /search:
    get:
      summary: Form-urlencoded querystring
      parameters:
        - name: qs
          in: querystring
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                required: [q]
                properties:
                  q: { type: string }
                  limit: { type: integer }
      responses:
        "200": { description: OK }
  /search-json:
    get:
      summary: JSON querystring
      parameters:
        - name: qs
          in: querystring
          content:
            application/json:
              schema:
                type: object
                properties:
                  q: { type: string }
      responses:
        "200": { description: OK }
