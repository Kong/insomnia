openapi: 3.2.0
info: { title: Security, version: 1.0.0 }
paths:
  /pets:
    get:
      summary: Secured list
      security:
        - authCode: [read]
        - deviceFlow: [read]
        - legacyKey: []
      responses:
        "200": { description: OK }
  /auth-code:
    get:
      summary: Auth code secured
      security:
        - authCode: [read]
      responses:
        "200": { description: OK }
  /device:
    get:
      summary: Device flow secured
      security:
        - deviceFlow: [read]
      responses:
        "200": { description: OK }
  /legacy:
    get:
      summary: Deprecated key secured
      security:
        - legacyKey: []
      responses:
        "200": { description: OK }
components:
  securitySchemes:
    authCode:
      type: oauth2
      oauth2MetadataUrl: https://auth.example.com/.well-known/oauth-authorization-server
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes: { read: Read access }
    deviceFlow:
      type: oauth2
      flows:
        deviceAuthorization:
          deviceAuthorizationUrl: https://auth.example.com/device
          tokenUrl: https://auth.example.com/token
          scopes: { read: Read access }
    legacyKey:
      type: apiKey
      in: header
      name: X-Legacy-Key
      deprecated: true
