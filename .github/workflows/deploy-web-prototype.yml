name: Deploy Web Prototype

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Vercel environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  deploy:
    name: Build and deploy web prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web prototype
        run: npm run build:web -w packages/insomnia
        env:
          NODE_ENV: production
          VITE_PASSCODE_HASH: ${{ secrets.VITE_PASSCODE_HASH }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: packages/insomnia
          vercel-args: ${{ inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
