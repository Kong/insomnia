name: Release Recurring
# This workflow bakes executables of the major platforms for Testing purposes
on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    types:
      - opened
      - synchronize
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PR_NUMBER: ${{ github.event.number }}

permissions: {}

jobs:
  build-and-upload-artifacts:
    timeout-minutes: 45
    # Skip jobs for release PRs
    # windows on recurring should be portable
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    env:
      # TEMPORARY: opt-in code signing for a single PR only. Remove this env and the
      # steps marked "signed build" before merging. Any other branch/event evaluates to false.
      SIGN_BUILD: ${{ github.event_name == 'pull_request' && github.event.number == 10470 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest-large
            build-targets: zip
          - os: windows-latest
            build-targets: portable
          - os: ubuntu-24.04
            build-targets: tar.gz
          - os: ubuntu-24.04-arm
            build-targets: tar.gz
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kong'

      - name: Install packages
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install x64 version of native Mac dependencies
        run: npm run install-x64-native-dependencies -w insomnia
        if: ${{ matrix.os == 'macos-latest-large' }}

      - name: Bump version
        shell: bash
        run: npm --workspaces version prerelease --preid="alpha-pr-$(git rev-parse --short HEAD)" --no-git-tag-version

      - name: Package
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: NODE_OPTIONS='--max_old_space_size=6144' BUILD_TARGETS='${{ matrix.build-targets }}' npm run app-package
        env:
          # Empty on every branch except the signed-build PR, which makes electron-builder skip signing.
          APPLE_ID: ${{ (matrix.os == 'macos-latest-large' && env.SIGN_BUILD == 'true') && secrets.DESIGNER_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ (matrix.os == 'macos-latest-large' && env.SIGN_BUILD == 'true') && secrets.DESIGNER_APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ (matrix.os == 'macos-latest-large' && env.SIGN_BUILD == 'true') && 'FX44YY62GV' || '' }}
          CSC_LINK: ${{ (matrix.os == 'macos-latest-large' && env.SIGN_BUILD == 'true') && secrets.DESIGNER_MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ (matrix.os == 'macos-latest-large' && env.SIGN_BUILD == 'true') && secrets.DESIGNER_MAC_CSC_KEY_PASSWORD || '' }}

      - name: Build and verify secure wrapper (Windows)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD != 'true' }}
        shell: bash
        run: NODE_OPTIONS='--max_old_space_size=6144' ./build-secure-wrapper.sh

      # ---8<--- TEMPORARY signed Windows build for PR #10470 only. Remove before merging. ---8<---
      - name: Setup DigiCert client cert (Windows, signed build)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD == 'true' }}
        shell: bash
        env:
          DIGICERT_CLIENT_CERT_B64: ${{ secrets.DIGICERT_SM_CLIENT_CERT_FILE_B64 }}
        run: |
          printf '%s' "$DIGICERT_CLIENT_CERT_B64" | base64 --decode > /d/Certificate_pkcs12.p12
          echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"

      - name: Setup Software Trust Manager (Windows, signed build)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD == 'true' }}
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1
        with:
          simple-signing-mode: true
        env:
          SM_HOST: ${{ vars.DIGICERT_SM_HOST }}
          SM_API_KEY: ${{ secrets.DIGICERT_SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.DIGICERT_SM_CLIENT_CERT_PASSWORD }}

      - name: Package unpacked app (Windows, signed build)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD == 'true' }}
        shell: bash
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run package:windows:unpacked -w insomnia
        env:
          SM_HOST: ${{ vars.DIGICERT_SM_HOST }}
          SM_API_KEY: ${{ secrets.DIGICERT_SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.DIGICERT_SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ secrets.DIGICERT_KEYPAIR_ALIAS }}

      - name: Compile secure wrapper (Windows, signed build)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD == 'true' }}
        shell: bash
        run: ./build-secure-wrapper.sh CI

      - name: Move .dll and .exe files to /tosign (Windows, signed build)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD == 'true' }}
        shell: pwsh
        run: |
          New-Item -Path "packages/insomnia/dist/win-unpacked/tosign" -ItemType Directory -Force
          Get-ChildItem -Path "packages/insomnia/dist/win-unpacked" -Filter *.dll | Move-Item -Destination "packages/insomnia/dist/win-unpacked/tosign"
          Get-ChildItem -Path "packages/insomnia/dist/win-unpacked" -Filter *.exe | Move-Item -Destination "packages/insomnia/dist/win-unpacked/tosign"

      - name: Code-sign unpacked binaries (Windows, signed build)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD == 'true' }}
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1
        with:
          simple-signing-mode: true
          input: packages/insomnia/dist/win-unpacked/tosign
          keypair-alias: ${{ secrets.DIGICERT_KEYPAIR_ALIAS }}
        env:
          SM_HOST: ${{ vars.DIGICERT_SM_HOST }}
          SM_API_KEY: ${{ secrets.DIGICERT_SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.DIGICERT_SM_CLIENT_CERT_PASSWORD }}

      - name: Move .dll and .exe files back to win-unpacked (Windows, signed build)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD == 'true' }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "packages/insomnia/dist/win-unpacked/tosign" -Filter *.dll | Move-Item -Destination "packages/insomnia/dist/win-unpacked"
          Get-ChildItem -Path "packages/insomnia/dist/win-unpacked/tosign" -Filter *.exe | Move-Item -Destination "packages/insomnia/dist/win-unpacked"
          Remove-Item -Path "packages/insomnia/dist/win-unpacked/tosign" -Recurse -Force

      - name: Package dist app (Windows, signed build)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD == 'true' }}
        shell: bash
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run package:windows:dist -w insomnia
        env:
          SM_HOST: ${{ vars.DIGICERT_SM_HOST }}
          SM_API_KEY: ${{ secrets.DIGICERT_SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.DIGICERT_SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ secrets.DIGICERT_KEYPAIR_ALIAS }}

      # build-secure-wrapper.sh CI leaves the C++ wrapper as Insomnia.exe, which Playwright cannot launch.
      - name: Restore original Insomnia.exe for smoke tests (Windows, signed build)
        if: ${{ matrix.os == 'windows-latest' && env.SIGN_BUILD == 'true' }}
        shell: pwsh
        run: Move-Item -Force "packages/insomnia/dist/win-unpacked/insomnia.dll" "packages/insomnia/dist/win-unpacked/Insomnia.exe"
      # ---8<--- end TEMPORARY signed Windows build ---8<---

      # See https://github.com/electron/electron/issues/42510#issuecomment-2171583086
      - if: ${{ runner.os == 'Linux' }}
        name: Lift unprivileged user namespace restrictions
        run: sudo sysctl kernel/apparmor_restrict_unprivileged_userns=0

      - name: Test critical path on packaged electron app
        run: npm run test:crit:package
        env:
          INSOMNIA_UPDATES_URL: http://localhost:4010

      - name: Upload smoke test traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          if-no-files-found: ignore
          name: ${{ matrix.os }}-package-critical-test-traces-${{ github.run_number }}
          path: packages/insomnia-smoke-test/traces

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: ${{ matrix.os }}-artifacts-${{ github.run_number }}
          path: |
            packages/insomnia/dist/*.exe
            packages/insomnia/dist/*.tar.gz
            packages/insomnia/dist/*.zip
            packages/insomnia/dist/*.yml
            packages/insomnia/dist/squirrel-windows/*.exe
