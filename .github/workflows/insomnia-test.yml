name: Insomnia Test

on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: insomnia-test-nonblocking-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the Insomnia binary once and upload it as an artifact. All shards
  # download the same binary instead of each building it.
  # ---------------------------------------------------------------------------
  build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kong'

      - name: Expand swap space
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      # node_modules is installed once here and cached by lockfile hash; the
      # test shards and result job restore it instead of running `npm ci`.
      # Restore must come before install; the save runs right after install so
      # later build steps can't alter what gets cached.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Type-check insomnia-test
        run: npm run type-check -w insomnia-test

      - name: Build Insomnia
        working-directory: packages/insomnia
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm run build:react-router -- --minify=false
          npx esr --cache ./scripts/build.ts --noErrorTruncation
          echo "=== build/ contents ==="
          ls -la build/ 2>/dev/null || echo "ERROR: build/ not found"
          test -f build/entry.main.min.js || { echo "ERROR: entry.main.min.js missing after build"; exit 1; }

      - name: Package Insomnia (Linux unpacked)
        working-directory: packages/insomnia
        env:
          USE_HARD_LINKS: 'false'
          # Package .map files so coverage reports show original (pre-compile) sources
          KEEP_SOURCEMAPS: 'true'
        run: npx electron-builder build --config ../insomnia-test/electron-builder.config.ts --linux --dir --publish never

      - name: Upload Insomnia binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: insomnia-linux-unpacked
          path: packages/insomnia/dist/linux-unpacked
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Run the whole suite across a fixed number of shards in parallel. Each shard restores the
  # downloaded binary and runs a slice of the suite, retrying failures in-process
  # (see playwright.config.ts `retries`).
  # ---------------------------------------------------------------------------
  parallel-test:
    name: Parallel Test
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6]
        shardTotal: [6]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Download Insomnia binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: insomnia-linux-unpacked
          path: packages/insomnia/dist/linux-unpacked

      # upload/download-artifact go through zip and drop Unix file modes, so
      # the binary and its helper executables (e.g. chrome_crashpad_handler)
      # would otherwise fail to spawn with EACCES.
      - name: Make Insomnia binary executable
        run: |
          cd packages/insomnia/dist/linux-unpacked
          chmod +x insomnia
          for f in chrome_crashpad_handler chrome-sandbox; do
            if [ -f "$f" ]; then chmod +x "$f"; fi
          done

      - name: Restore node_modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Install Electron system dependencies
        working-directory: packages/insomnia-test
        run: npx playwright install-deps chromium

      - name: Install ffmpeg (required for video recording)
        working-directory: packages/insomnia-test
        run: npx playwright install ffmpeg

      - name: Download previous Playwright last run state
        if: ${{ github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-last-run-shard-${{ matrix.shardIndex }}-attempt-*
          path: .playwright-last-run-history

      - name: Run Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        working-directory: packages/insomnia-test
        env:
          INSOMNIA_BINARY: ${{ github.workspace }}/packages/insomnia/dist/linux-unpacked/insomnia
          PLAYWRIGHT_BLOB_OUTPUT_NAME: blob-report-${{ matrix.shardIndex }}.zip
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results.xml
          COVERAGE: 'true'
        run: |
          LAST_FAILED_ARGS=()

          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            # Latest earlier attempt's .last-run.json for this shard, if any.
            PREVIOUS_FILE="$(
              find ../../.playwright-last-run-history -type f -name '.last-run.json' 2>/dev/null \
                | sed -E 's/.*attempt-([0-9]+).*/\1 &/' \
                | sort -k1,1nr | head -n1 | cut -d' ' -f2-
            )"
            if [ -n "$PREVIOUS_FILE" ] && node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); process.exit(Array.isArray(d.failedTests) && d.failedTests.length ? 0 : 1)" "$PREVIOUS_FILE"; then
              echo "Rerun attempt detected. Running only last failed tests for shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}."
              mkdir -p test-results
              cp "$PREVIOUS_FILE" test-results/.last-run.json
              LAST_FAILED_ARGS+=(--last-failed)
            else
              echo "::notice::No failed tests recorded for shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}. Running full shard."
            fi
          fi

          xvfb-run --auto-servernum npx playwright test --reporter=list,html,blob,junit --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} "${LAST_FAILED_ARGS[@]}"

      - name: Upload Playwright last run state
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-last-run-shard-${{ matrix.shardIndex }}-attempt-${{ github.run_attempt }}
          path: packages/insomnia-test/test-results/.last-run.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Upload junit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: junit-results-${{ github.run_number }}-shard-${{ matrix.shardIndex }}
          path: packages/insomnia-test/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

      # Two paths here (not just coverage/raw/) because v8-report.json (see
      # misc/coverage.ts) must live as a sibling of raw/, not inside it — the
      # upload computes a common ancestor across both, so raw/'s own
      # contents now land one level deeper in the artifact, under `raw/`.
      - name: Upload coverage (raw)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-raw-${{ matrix.shardIndex }}
          path: |
            packages/insomnia-test/coverage/raw/
            packages/insomnia-test/coverage/v8-report.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: packages/insomnia-test/playwright-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload blob report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: packages/insomnia-test/blob-report/blob-report-${{ matrix.shardIndex }}.zip
          retention-days: 1
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # This job doesn't gate the workflow — parallel-test (no continue-on-error)
  # already fails the run on its own if any shard fails. This job only
  # merges every shard's raw V8 coverage data (collected on both develop
  # pushes and PRs — see parallel-test's COVERAGE env) into one coverage
  # report, and every shard's blob report into one full-suite Playwright
  # report — both run on every trigger this workflow has (push and
  # pull_request are the only two, so no `if` gate is needed on either).
  # Each merge step is its own `continue-on-error: true` so a merge failure
  # never fails this job. It finishes by deleting every per-shard
  # intermediate (coverage-raw-*, playwright-report-*, blob-report-*),
  # leaving only the merged artifact(s).
  # ---------------------------------------------------------------------------
  insomnia-test-result:
    name: Insomnia Test Result
    needs: parallel-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repo
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        continue-on-error: true
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      # Full install (not just monocart-coverage-reports) so `npx playwright
      # merge-reports` below is the exact same Playwright version the shards
      # generated their blob reports with.
      - name: Restore node_modules
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      # Coverage raw data can embed `file:` sourcemap URLs pointing into this
      # build output (see parallel-test's own restore step). Without it
      # here, sourcemap resolution silently fails for those
      # scripts during the merge below, deflating line/statement/branch
      # coverage relative to what each shard reports locally.
      - name: Download Insomnia binary
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: insomnia-linux-unpacked
          path: packages/insomnia/dist/linux-unpacked

      - name: Download raw coverage from all shards
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: coverage-raw
          pattern: coverage-raw-*

      # Uses our own line/statement/branch/function union across each shard's
      # own (already-correct) v8-json report, instead of monocart's built-in
      # multi-shard raw-coverage merge (misc/merge-coverage.ts) — that merge
      # has a bug where combining a script's coverage across shards with very
      # different coverage levels can produce a result *lower* than any
      # individual shard reported on its own. See misc/merge-coverage-union.ts
      # for the full writeup.
      - name: Merge coverage reports
        id: merge-coverage
        continue-on-error: true
        working-directory: packages/insomnia-test
        run: node misc/merge-coverage-union.ts ../../coverage-raw

      - name: Upload merged coverage report
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: packages/insomnia-test/coverage-merged/
          retention-days: 30

      - name: Download blob reports from all shards
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        id: merge-report
        continue-on-error: true
        working-directory: packages/insomnia-test
        run: npx playwright merge-reports --reporter=html ../../all-blob-reports

      - name: Upload merged Playwright report
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: packages/insomnia-test/playwright-report/
          retention-days: 30

      - name: Warn if a merge step failed
        if: ${{ always() && (steps.merge-coverage.outcome == 'failure' || steps.merge-report.outcome == 'failure') }}
        run: |
          {
            echo "### :warning: Insomnia Test report merge failed"
            echo "- Merge coverage reports: ${{ steps.merge-coverage.outcome }}"
            echo "- Merge Playwright reports: ${{ steps.merge-report.outcome }}"
            echo "The merged artifacts may be missing; per-shard artifacts are still available."
          } >> "$GITHUB_STEP_SUMMARY"
