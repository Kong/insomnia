name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the Insomnia binary once and cache it by the develop commit SHA. All
  # shards restore the same cached binary instead of each building it.
  # ---------------------------------------------------------------------------
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.insomnia-sha.outputs.sha }}
    steps:
      - name: Checkout Insomnia source
        uses: actions/checkout@v5
        with:
          repository: Kong/insomnia
          ref: develop
          path: insomnia-src

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Get Insomnia commit SHA
        id: insomnia-sha
        run: echo "sha=$(git -C insomnia-src rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache Insomnia binary
        id: binary-cache
        uses: actions/cache@v5
        with:
          path: insomnia-src/packages/insomnia/dist/linux-unpacked
          key: insomnia-linux-unpacked-${{ steps.insomnia-sha.outputs.sha }}

      - name: Expand swap space
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Remove verify-bundle-plugins from postinstall
        if: steps.binary-cache.outputs.cache-hit != 'true'
        working-directory: insomnia-src
        run: |
          sed -i 's/ && npm run verify-bundle-plugins -w insomnia//' package.json

      - name: Install Insomnia dependencies
        if: steps.binary-cache.outputs.cache-hit != 'true'
        working-directory: insomnia-src
        run: npm ci

      - name: Build Insomnia
        if: steps.binary-cache.outputs.cache-hit != 'true'
        working-directory: insomnia-src/packages/insomnia
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm run build
          echo "=== build/ contents ==="
          ls -la build/ 2>/dev/null || echo "ERROR: build/ not found"
          test -f build/entry.main.min.js || { echo "ERROR: entry.main.min.js missing after build"; exit 1; }

      - name: Package Insomnia (Linux unpacked)
        if: steps.binary-cache.outputs.cache-hit != 'true'
        working-directory: insomnia-src/packages/insomnia
        env:
          USE_HARD_LINKS: "false"
        run: npx electron-builder build --config electron-builder.config.js --linux --dir --publish never

  # ---------------------------------------------------------------------------
  # Run the tests across N shards in parallel. Each shard restores the cached
  # binary and runs a slice of the suite with a single worker.
  # ---------------------------------------------------------------------------
  test:
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # To scale up, add indices here and bump shardTotal to match.
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Restore Insomnia binary
        uses: actions/cache/restore@v5
        with:
          path: insomnia-src/packages/insomnia/dist/linux-unpacked
          key: insomnia-linux-unpacked-${{ needs.build.outputs.sha }}
          fail-on-cache-miss: true

      - name: Install test dependencies
        working-directory: packages/insomnia-test
        run: npm ci

      - name: Install Electron system dependencies
        working-directory: packages/insomnia-test
        run: npx playwright install-deps chromium

      - name: Install ffmpeg (required for video recording)
        working-directory: packages/insomnia-test
        run: npx playwright install ffmpeg

      - name: Run Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        working-directory: packages/insomnia-test
        env:
          INSOMNIA_BINARY: ${{ github.workspace }}/insomnia-src/packages/insomnia/dist/linux-unpacked/insomnia
        run: xvfb-run --auto-servernum npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Allure results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.shardIndex }}
          # Raw Allure results (with traces/screenshots attached on failure).
          path: packages/insomnia-test/allure-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Merge every shard's Allure results and generate one Allure report.
  # ---------------------------------------------------------------------------
  report:
    needs: test
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Java (required by the Allure CLI)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: packages/insomnia-test
        run: npm ci

      - name: Download Allure results from all shards
        uses: actions/download-artifact@v7
        with:
          path: packages/insomnia-test/allure-results
          pattern: allure-results-*
          merge-multiple: true

      # Pull the previous run's history so the Allure report shows trends
      # (pass/fail over time). Non-fatal on the first run when none exists.
      - name: Restore Allure history
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin gh-pages --depth=1 || exit 0
          prev=$(git ls-tree --name-only origin/gh-pages | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -n "$prev" ]; then
            echo "Carrying history forward from run $prev"
            git archive origin/gh-pages "$prev/history" 2>/dev/null | tar -x --strip-components=1 -C packages/insomnia-test/allure-results || true
          fi

      - name: Generate Allure report
        working-directory: packages/insomnia-test
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: packages/insomnia-test/allure-report/
          retention-days: 30

      # Publish the report to GitHub Pages so it can be viewed in the browser
      # without downloading — one directory per run, old runs kept.
      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: ${{ github.event_name == 'push' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/insomnia-test/allure-report
          destination_dir: ${{ github.run_number }}
          keep_files: true

      - name: Add report link to job summary
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "### 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/" >> $GITHUB_STEP_SUMMARY

      # The per-shard allure-results-* artifacts are only a transport between
      # the test jobs and this one. Now that they're merged into the report,
      # delete them so only the final allure-report remains.
      - name: Delete per-shard intermediate artifacts
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api --paginate \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | test("^allure-results-[0-9]+$")) | .id')
          for id in $ids; do
            echo "Deleting intermediate artifact $id"
            gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id"
          done
