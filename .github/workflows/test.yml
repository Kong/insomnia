name: Test App

on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
      packages: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@kong"

      - name: Install packages
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Type checks
        run: npm run type-check

      - name: Unit Tests
        run: npm test

      - name: Check Circular References
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const MAX_CIRCULAR_REFERENCES = 172;

            // Function to generate markdown report
            function generateMarkdownReport(circularReferences, count) {
              const timestamp = new Date().toISOString();
              const status = count > MAX_CIRCULAR_REFERENCES ? '❌ FAILED' : '✅ PASSED';
              
              return `# Circular References Report

            **Generated at:** ${timestamp}  
            **Total circular references:** ${count}  
            **Limit:** ${MAX_CIRCULAR_REFERENCES}  
            **Status:** ${status}

            <details>
            <summary>Click to view all circular references (${count})</summary>

            \`\`\`
            ${circularReferences.sort().map(cycle => cycle.join(' -> ')).join('\n')}
            \`\`\`

            </details>

            ## Analysis

            ${
              count > MAX_CIRCULAR_REFERENCES
                ? `⚠️ **Warning:** The number of circular references (${count}) exceeds the limit of ${MAX_CIRCULAR_REFERENCES}. Please consider refactoring to reduce circular dependencies.`
                : `✅ **Good:** The number of circular references (${count}) is within the acceptable limit of ${MAX_CIRCULAR_REFERENCES}.`
            }

            ---
            *This report was generated automatically by the circular reference checker.*
            `;
            }

            try {
              // Change to the packages directory
              process.chdir('packages');
              
              // Run circular reference check
              console.log('Analyzing circular references...');
              const madge = require('madge');
              const res = await madge(process.cwd(), {
                fileExtensions: ['ts', 'tsx'],
              });
              
              const circularReferences = res.circular();
              const count = circularReferences.length;
              
              console.log(`Found ${count} circular references`);
              
              // Generate report
              const markdownContent = generateMarkdownReport(circularReferences, count);
              
              // For PR comments
              if (context.eventName === 'pull_request') {
                try {
                  // Find previous comments
                  const { data: comments } = await github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                  });
                  
                  const botComment = comments.find(comment => 
                    comment.user?.type === 'Bot' && 
                    comment.body?.includes('# Circular References Report')
                  );
                  
                  if (botComment) {
                    // Update existing comment
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: botComment.id,
                      body: markdownContent
                    });
                    console.log('Updated existing PR comment');
                  } else {
                    // Create new comment
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      body: markdownContent
                    });
                    console.log('Created new PR comment');
                  }
                } catch (error) {
                  console.error('Error posting PR comment:', error);
                  // Don't let comment failure affect the entire CI
                }
              }
              
              // Output circular references to console for logs
              if (count > 0) {
                console.log('\nCircular references found:');
                circularReferences.forEach(cycle => console.log(cycle.join(' -> ')));
              }
              
              // Fail if exceeds limit
              if (count > MAX_CIRCULAR_REFERENCES) {
                core.setFailed(`Circular references count (${count}) exceeds the limit (${MAX_CIRCULAR_REFERENCES})`);
              } else {
                console.log(`✅ Circular references count (${count}) is within the limit (${MAX_CIRCULAR_REFERENCES})`);
              }
              
            } catch (error) {
              console.error('Error analyzing circular references:', error);
              core.setFailed('Failed to analyze circular references');
            }
