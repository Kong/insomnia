---
# Keep the KSAI workflow file whole at .github/workflows/ksai.yml and fill in its four federation
# identifiers. If you rename it, update continuation_workflow; the review request dispatcher reads
# the caller filename automatically
#
# Use Set up KSAI to verify each value and learn which parts are unsafe to remove.
# https://ksai.kongcloud.io/setup/simple
name: KSAI

permissions: {}

on:  # yamllint disable-line rule:truthy
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [review_requested, opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: false
      actor:
        description: GitHub username to authorize against CODEOWNERS, matching comment authorization
        required: false
      issue_number:
        description: Issue number for plan continuation; empty when work_ref names the work
        required: false
      work_ref:
        description: The work to do when there is no GitHub issue, as jira/<KEY>
        required: false
      attempt:
        description: Runs already spent by this continuation chain
        required: false
      stall:
        description: Consecutive runs that completed no step
        required: false
      prev_remaining:
        description: Unchecked boxes seen by the predecessor, with empty distinct from zero
        required: false
      comment_id:
        description: Comment a dispatched request answers, read back from GitHub rather than believed
        required: false
      comment_kind:
        description: Which space comment_id came from, issue, review or submitted_review
        required: false
      record_id:
        description: Dispatch record written for this run, read back over the run's own OIDC token
        required: false

jobs:
  ksai:
    name: run
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.pr != '' || inputs.issue_number != '' || inputs.work_ref != '' ||
      inputs.comment_id != '' || inputs.comment_kind != '')) ||
      ((github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review_comment') &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/ksai') ||
      (vars.KSAI_TRIGGER_PHRASE != '' &&
      contains(github.event.comment.body, vars.KSAI_TRIGGER_PHRASE))))
    uses: Kong/ksai/.github/workflows/ksai.yml@5a8338dc67a355b42820f4c2d3ada91bdf765cdd  # ksai/v3.102.3
    permissions:
      contents: write       # checked out by every command, and pushed by one that changes code
      issues: write         # every command answers with a comment, and reacts to the one that asked
      pull-requests: write  # post reviews and maintain draft pull request plans
      id-token: write       # mint the GitHub OIDC token for federation
      checks: read          # read what CI said about the head
      statuses: read        # the older API a build may report through
      actions: write        # support old caller review dispatch, successor plan runs and test publication
    with:
      trigger_phrase: ${{ vars.KSAI_TRIGGER_PHRASE }}
      runs_on: '["kong-inc-dedicated","size-md","amd64"]'
      federation_rule_id: fdrl_01SuXMcSBJPmwTbmPrnBkVFa
      organization_id: 4ce7a6d3-9549-4842-bd51-1def5eba611b
      service_account_id: svac_019MqwtwTW6SEKnEUuDUnMYE
      workspace_id: wrkspc_01G7dX83HGYMZDwLuJNPnA5T
      continuation_workflow: ''
      clear_request: true
      disabled_commands: test implement approve fix revise unlock resume
      pr: ${{ inputs.pr }}
      actor: ${{ inputs.actor }}
      issue_number: ${{ inputs.issue_number }}
      work_ref: ${{ inputs.work_ref }}
      attempt: ${{ inputs.attempt }}
      stall: ${{ inputs.stall }}
      prev_remaining: ${{ inputs.prev_remaining }}
      comment_id: ${{ inputs.comment_id }}
      comment_kind: ${{ inputs.comment_kind }}
      record_id: ${{ inputs.record_id }}
    secrets:
      ksai_private_key: ${{ secrets.KSAI_PRIVATE_KEY }}
      datadog_key: ${{ secrets.KSAI_DATADOG_KEY }}

  request:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.action == 'review_requested' &&
      github.event.requested_team.slug == (vars.KSAI_REVIEW_TEAM || 'ksai') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot')
    uses: Kong/ksai/.github/workflows/ksai-request.yml@main  # ksai/v3.102.3
    permissions:
      actions: write  # dispatch this workflow onto the default branch
      contents: read  # download the actions this call runs, which live in a private repository
    with:
      runs_on: '["kong-inc-dedicated","size-md","amd64"]'
    secrets:
      ksai_private_key: ${{ secrets.KSAI_PRIVATE_KEY }}

  approval:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event_name == 'pull_request' &&
      contains(fromJSON('["opened", "synchronize", "reopened", "edited"]'), github.event.action) &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')) ||
      (github.event_name == 'pull_request_review' &&
      (github.event.sender.type != 'Bot' || github.event.action == 'dismissed') &&
      github.event.review.state != 'commented'))
    uses: Kong/ksai/.github/workflows/ksai-hold.yml@5a8338dc67a355b42820f4c2d3ada91bdf765cdd  # ksai/v3.102.3
    permissions:
      contents: read        # download the action this call runs, which lives in a private repository
      pull-requests: write  # dismiss an approval from somebody who contributed to the pull request
      statuses: write       # report the check the ruleset makes required
