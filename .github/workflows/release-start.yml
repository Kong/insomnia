name: Release Start
run-name: Deploy ${{ github.event.inputs.version}} to ${{ github.event.inputs.channel }} channel by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      channel:
        required: true
        type: choice
        description: Channel of the release (alpha/beta/stable)
        options:
          - alpha
          - beta
          - stable
      version:
        required: false
        description: force version of the release (e.g. 9.0.0) if previous release was successful, this should auto increment

jobs:
  setup-release-branch:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install packages
        run: npm ci

      # ############################################################
      # SETUP RELEASE_VERSION and RELEASE_BRANCH

      - name: App version (stable, patch latest stable)
        if: github.event.inputs.channel == 'stable' && !github.event.inputs.version
        run: npm --workspaces version patch

      - name: App version (stable, with a specific version)
        if: github.event.inputs.channel == 'stable' && github.event.inputs.version
        run: npm --workspaces version "${{ github.event.inputs.version }}"

      - name: App version (alpha/beta, patch latest alpha/beta)
        if: github.event.inputs.channel != 'stable' && !github.event.inputs.version
        run: npm --workspaces version --preid "${{ github.event.inputs.channel }}" prerelease

      - name: App version (alpha/beta, with a specific version)
        if: github.event.inputs.channel != 'stable' && github.event.inputs.version
        run: npm --workspaces version "${{ github.event.inputs.version }}"

      # ############################################################

      - name: Get version
        shell: bash
        run: |
          echo "RELEASE_VERSION=$(node -e "console.log(require('./packages/insomnia/package.json').version)")" >> $GITHUB_ENV
          echo "RELEASE_BRANCH=release/$(node -e "console.log(require('./packages/insomnia/package.json').version)")" >> $GITHUB_ENV

      - name: Create Branch # Create a branch if it doesn't exist
        uses: peterjgrainger/action-create-branch@c2800a3a9edbba2218da6861fa46496cf8f3195a # v2.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: ${{ env.RELEASE_BRANCH }}

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          persist-credentials: false

      - name: Configure Git user
        id: configure_git_user
        uses: Homebrew/actions/git-user-config@266845213695c3047d210b2e8fbc42ecdaf45802 # master
        with:
          username: ${{ (github.event_name == 'workflow_dispatch' && github.actor) || 'insomnia-infra' }}

      # ############################################################
      # re-run the versioning steps to apply to the new branch

      - name: (Re-run) App version (stable, patch latest stable)
        if: github.event.inputs.channel == 'stable' && !github.event.inputs.version
        run: npm --workspaces version patch

      - name: (Re-run) App version (stable, with a specific version)
        if: github.event.inputs.channel == 'stable' && github.event.inputs.version
        run: npm --workspaces version "${{ github.event.inputs.version }}"

      - name: (Re-run) App version (alpha/beta, patch latest alpha/beta)
        if: github.event.inputs.channel != 'stable' && !github.event.inputs.version
        run: npm --workspaces version --preid "${{ github.event.inputs.channel }}" prerelease

      - name: (Re-run) App version (alpha/beta, with a specific version)
        if: github.event.inputs.channel != 'stable' && github.event.inputs.version
        run: npm --workspaces version "${{ github.event.inputs.version }}"

      # ############################################################

      - name: Git Commit
        run: git commit -am "Bump app version to ${{ env.RELEASE_VERSION }}"

      - name: Git Push changes
        run: |
          remote_repo="https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${remote_repo}" --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}

      - name: Create Pull Request
        run: |
          gh pr create \
            --base develop \
            --head ${{ env.RELEASE_BRANCH }} \
            --title ":rocket: ${{ env.RELEASE_VERSION}}" \
            --body "**Automated pull request**"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}

      - name: Create Pull Request in CE
        run: |
          gh pr create \
          --base develop \
          --head ${{ env.RELEASE_BRANCH }} \
          --title ":rocket: ${{ env.RELEASE_VERSION}}" \
          --repo kong/insomnia \
          --body "$(cat <<EOF
          # WARNING: <ins>Do not merge</ins> this PR. Use the "Publish" workflow.

          ## Publish workflow:

          When ready to publish, trigger [Publish](https://github.com/Kong/insomnia/actions/workflows/release-publish.yml) workflow with these variables:
          - Release version (\`version\`): \`${{ env.RELEASE_VERSION}}\`

          Alternatively, you can trigger the workflow from [GitHub CLI](https://cli.github.com/):
          \`\`\`bash
          gh workflow run release-publish.yml -f version=${{ env.RELEASE_VERSION}} --repo Kong/insomnia
          \`\`\`

          > Release notes will be generated automatically based on the commit messages during publish. Remove any unwanted notes manually afterwards.

          <details>
          <summary>Merge branch step failed on the publish workflow? Try this...</summary>

          Run locally:

          \`\`\`bash
          # Make sure git remote is Kong/insomnia...

          git checkout develop
          git merge --no-ff release/${{ env.RELEASE_VERSION}}

          # Solve merge conflicts ...
          # If there's package-lock conflicts, run \`npm install\` and commit the package-lock changes

          git push
          \`\`\`
          </details>
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
