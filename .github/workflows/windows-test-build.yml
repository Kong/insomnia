name: Windows Test Build

# Builds the Windows app and inso without any code signing, so no DigiCert signing tokens are used.
# The artifacts are UNSIGNED and are for testing only. release-publish.yml only reads artifacts from
# release-build.yml, so these artifacts can never be published by it.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-unsigned:
    timeout-minutes: 45
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
    env:
      INSO_PACKAGE_NAME: insomnia-inso
      # Read by packages/insomnia/customSign.js
      SKIP_WINDOWS_SIGN: 'true'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kong'

      - name: Install packages
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Setup Inso CLI version env var
        shell: bash
        run: |
          echo "INSO_VERSION=$(jq .version ./packages/${{ env.INSO_PACKAGE_NAME }}/package.json -rj)" >> $GITHUB_ENV

      # creates unpacked electron-builder contents
      - name: Package unpacked app
        shell: bash
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run package:windows:unpacked -w insomnia

      # --win --dir builds no nsis target, so the afterPack hook writes app-update.yml. NSIS auto-update fails without it.
      - name: Check app-update.yml exists in unpacked app
        shell: bash
        run: |
          f=packages/insomnia/dist/win-unpacked/resources/app-update.yml
          if [ ! -s "$f" ] || ! grep -q 'updates.insomnia.rest' "$f"; then
            echo "::error::$f is missing or invalid"
            exit 1
          fi
          cat "$f"

      # It must stay after the app packaging step, install-libcurl-node swaps the libcurl binary.
      - name: Package inso
        shell: bash
        run: |
          npm run install-libcurl-node
          npm run build:production -w insomnia-inso
          npm run package -w insomnia-inso
        env:
          VERSION: ${{ env.INSO_VERSION }}

      # wraps the Insomnia.exe PE with another PE that will bootstrap particular security
      # features added to Windows 8 in order to stopgap CVE-2025-1353
      - name: Compile secure wrapper
        shell: bash
        run: ./build-secure-wrapper.sh CI

      # re-packages the unpacked electron-builder contents into the installer
      # SKIP_SIGN_PREPACKAGED_APP_EXE: same as release-build.yml, Squirrel must not sign the wrapper Insomnia.exe
      - name: Package dist app
        shell: bash
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run package:windows:dist -w insomnia
        env:
          SKIP_SIGN_PREPACKAGED_APP_EXE: 'true'

      - name: Create Inso zip/tar/gz artifacts
        shell: bash
        run: npm run artifacts -w insomnia-inso

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: UNSIGNED-Windows-X64-artifacts
          path: |
            packages/insomnia/dist/*.exe
            packages/insomnia/dist/*.yml
            packages/insomnia/dist/squirrel-windows/*
            packages/insomnia-inso/artifacts/*
